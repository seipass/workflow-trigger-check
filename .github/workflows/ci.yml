name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 20
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install (no runtime dependencies)
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Lint this repository's own workflows
        run: node bin/workflow-trigger-check.js .
      - name: Help and version work offline
        run: |
          node bin/workflow-trigger-check.js --help
          node bin/workflow-trigger-check.js --version
